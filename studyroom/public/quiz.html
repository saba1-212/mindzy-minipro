<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mindzy – Manual Quiz Creator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f8ff;
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #374785;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .section {
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #374785;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #24305e;
    }

    .quiz-item {
      background: #eaf0ff;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .quiz-item p {
      margin: 5px 0;
    }

    .delete {
      background: #ff4d4d;
      margin-top: 5px;
    }

    hr {
      border: none;
      border-top: 2px dashed #ccc;
      margin: 40px 0;
    }
  </style>
</head>
<body>

  <h1>📝 Manual Quiz Creator – Mindzy</h1>
  <div class="container">

    <div class="section">
      <h2>Create MCQ</h2>
      <label>Question</label>
      <input type="text" id="mcq-question">
      <label>Option A</label>
      <input type="text" id="optionA">
      <label>Option B</label>
      <input type="text" id="optionB">
      <label>Option C</label>
      <input type="text" id="optionC">
      <label>Option D</label>
      <input type="text" id="optionD">
      <label>Correct Answer</label>
      <select id="correct">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
      <button onclick="saveMCQ()">Save MCQ</button>
    </div>

    <hr>

    <div class="section">
      <h2>Create Short Answer Question</h2>
      <label>Question</label>
      <input type="text" id="qa-question">
      <label>Answer</label>
      <textarea id="qa-answer" rows="3"></textarea>
      <button onclick="saveQA()">Save Q&A</button>
    </div>

    <hr>

    <div class="section">
      <h2>📚 Saved Questions</h2>
      <div id="quiz-list"></div>
      <button onclick="downloadQuiz()">📥 Download Quiz</button>
      <button onclick="generateQuizForm()">🔗 Generate Shareable Quiz Form</button>
    </div>

  </div>

  <script>
    let quizzes = JSON.parse(localStorage.getItem("manualQuizList")) || [];

    function saveMCQ() {
      const question = document.getElementById("mcq-question").value.trim();
      const optionA = document.getElementById("optionA").value.trim();
      const optionB = document.getElementById("optionB").value.trim();
      const optionC = document.getElementById("optionC").value.trim();
      const optionD = document.getElementById("optionD").value.trim();
      const correct = document.getElementById("correct").value;

      if (!question || !optionA || !optionB || !optionC || !optionD) {
        alert("Please fill in all MCQ fields.");
        return;
      }

      const mcq = {
        type: "MCQ",
        question,
        options: { A: optionA, B: optionB, C: optionC, D: optionD },
        correct
      };

      quizzes.push(mcq);
      localStorage.setItem("manualQuizList", JSON.stringify(quizzes));
      displayQuizzes();
      clearMCQForm();
    }

    function saveQA() {
      const question = document.getElementById("qa-question").value.trim();
      const answer = document.getElementById("qa-answer").value.trim();

      if (!question || !answer) {
        alert("Please fill in both question and answer.");
        return;
      }

      const qa = { type: "QA", question, answer };
      quizzes.push(qa);
      localStorage.setItem("manualQuizList", JSON.stringify(quizzes));
      displayQuizzes();
      clearQAForm();
    }

    function deleteQuiz(index) {
      if (confirm("Are you sure you want to delete this quiz item?")) {
        quizzes.splice(index, 1);
        localStorage.setItem("manualQuizList", JSON.stringify(quizzes));
        displayQuizzes();
      }
    }

    function displayQuizzes() {
      const list = document.getElementById("quiz-list");
      list.innerHTML = "";

      if (quizzes.length === 0) {
        list.innerHTML = "<p>No quizzes saved yet.</p>";
        return;
      }

      quizzes.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "quiz-item";

        if (item.type === "MCQ") {
          div.innerHTML = `
            <p><strong>MCQ:</strong> ${item.question}</p>
            <p>A. ${item.options.A}</p>
            <p>B. ${item.options.B}</p>
            <p>C. ${item.options.C}</p>
            <p>D. ${item.options.D}</p>
            <p><strong>Correct:</strong> ${item.correct}</p>
            <button class="delete" onclick="deleteQuiz(${index})">Delete</button>
          `;
        } else {
          div.innerHTML = `
            <p><strong>Q:</strong> ${item.question}</p>
            <p><strong>A:</strong> ${item.answer}</p>
            <button class="delete" onclick="deleteQuiz(${index})">Delete</button>
          `;
        }

        list.appendChild(div);
      });
    }

    function clearMCQForm() {
      document.getElementById("mcq-question").value = "";
      document.getElementById("optionA").value = "";
      document.getElementById("optionB").value = "";
      document.getElementById("optionC").value = "";
      document.getElementById("optionD").value = "";
      document.getElementById("correct").value = "A";
    }

    function clearQAForm() {
      document.getElementById("qa-question").value = "";
      document.getElementById("qa-answer").value = "";
    }

    function downloadQuiz() {
      const blob = new Blob([JSON.stringify(quizzes, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "manual-quiz.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function generateQuizForm() {
      const win = window.open("", "_blank");
      let html = `<html><head><title>Mindzy Quiz</title></head><body><h1>📝 Solve the Quiz</h1>
      <form onsubmit="event.preventDefault();let score=0;const inputs=document.querySelectorAll('[data-answer]');inputs.forEach(i=>{if(i.checked&&i.dataset.answer==='true')score++});alert('Your Score: '+score+'/'+inputs.length);">`;

      quizzes.forEach((item, i) => {
        if (item.type === "MCQ") {
          html += `<p><strong>${i + 1}. ${item.question}</strong><br>`;
          ["A", "B", "C", "D"].forEach(opt => {
            html += `<label><input type="radio" name="q${i}" data-answer="${item.correct === opt}" /> ${item.options[opt]}</label><br>`;
          });
          html += `</p>`;
        } else {
          html += `<p><strong>${i + 1}. ${item.question}</strong><br><em>(Short answer – not auto-graded)</em></p>`;
        }
      });

      html += `<br><button type="submit">Submit</button></form></body></html>`;
      win.document.write(html);
      win.document.close();
    }
      
    displayQuizzes();
  </script>
  <script src="quiz.js"></script> <!-- assuming you moved your code here -->

</body>
</html>
